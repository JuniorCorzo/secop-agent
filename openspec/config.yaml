schema: spec-driven

context: |
  Tech stack: NestJS (backend), React + Vite (frontend), PostgreSQL + pgvector, Redis, BullMQ
  Package manager: bun
  Monorepo: workspaces under apps/nest and apps/web
  Domain: SECOP licitaciones (Colombian public bidding analysis platform)
  Backend conventions:
    - Modular structure: src/common/, src/config/, src/modules/
    - Placeholder modules only; no business logic in scaffold issues
    - Strict TypeScript: noImplicitAny, strictBindCallApply, noFallthroughCasesInSwitch
    - Builder: SWC (requires @swc/cli + @swc/core)
  Completed changes:
    - ANC-61 (backbone-modular-foundation): NestJS scaffold with 10 domain placeholders, strict TS, SWC. ARCHIVED.
    - ANC-62 (persistence-foundation): TypeORM wired, baseline migration (pgvector+pg_trgm+health), Docker DB verified. ARCHIVED. Domain tables pending (implemented incrementally with ANC-67+).
  ANC-64 in progress:
    - Env validation via ConfigModule + class-validator/class-transformer
    - Added auth/redis config factories and `apps/nest/.env.example`
    - Added `HealthModule` with Postgres, Redis, Hermes, and LLM checks
    - Bootstrap and TypeORM wiring now use `ConfigService` values, not direct `process.env`
  We use conventional commits

