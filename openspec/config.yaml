schema: spec-driven

context: |
  Tech stack: NestJS (backend), React + Vite (frontend), PostgreSQL + pgvector, Redis, BullMQ
  Package manager: bun
  Monorepo: workspaces under apps/nest and apps/web
  Domain: SECOP licitaciones (Colombian public bidding analysis platform)
  Backend conventions:
    - Modular structure: src/common/, src/config/, src/modules/
    - Placeholder modules only; no business logic in scaffold issues
    - Strict TypeScript: noImplicitAny, strictBindCallApply, noFallthroughCasesInSwitch
    - Builder: SWC (requires @swc/cli + @swc/core)
  Current change (ANC-61): backend modular scaffold complete in apps/nest
    - Config factories: app, database, llm, hermes
    - Common module: global placeholder with decorators/filters/guards/interceptors/pipes subdirs
    - Domain placeholders: auth, convocatorias, companies, scoring, competitors, rag, documents, llm, alerts, audit
    - Root composition: AppModule imports ConfigModule + CommonModule + all domain modules
    - Bootstrap: ValidationPipe, CORS, global prefix 'api'
    - TypeScript strictness: noImplicitAny, strictBindCallApply, noFallthroughCasesInSwitch
    - Build tool: SWC via @nestjs/cli (typeCheck + swc builder)
  We use conventional commits

